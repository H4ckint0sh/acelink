name: Build and push acelink engine image

on:
  push:
    branches: [master]
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v5
        if: ${{ github.ref == 'refs/heads/master' }}
        with:
          context: .
          platforms: linux/amd64  # linux/arm64 won't work because there's no acestream bin for this platform
          push: true
          tags: ghcr.io/h4ckint0sh/acelink:latest
      -
        name: Build and push
        uses: docker/build-push-action@v5
        if: ${{ github.event.release.tag_name }}
        with:
          context: .
          platforms: linux/amd64  # linux/arm64 see above
          push: true
          tags: ghcr.io/h4ckint0sh/acelink:${{ github.event.release.tag_name }}
